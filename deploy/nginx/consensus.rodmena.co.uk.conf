# consensus.rodmena.co.uk -- TLS edge for the etcd cluster.
# Reference copy lives in the repo at deploy/nginx/; installed to /etc/nginx/conf.d/.
#
# The etcd members listen on loopback only (127.0.0.1:2379/2479/2579). This
# vhost is the sole public route to them. It serves three things on one origin:
#
#   * the etcd v3 HTTP/JSON API under /v3/     (plain HTTPS clients, curl)
#   * the etcd gRPC API                        (etcdctl and real etcd SDKs)
#   * static integration docs at /docs and /llms.txt
#
# Authentication is enforced by etcd's own RBAC, not here -- every /v3/kv,
# /v3/lease and watch call needs a token from /v3/auth/authenticate. The blocks
# below are defence in depth on top of that: they refuse the operations whose
# blast radius is the whole cluster even if an admin credential leaks.

upstream consensus_etcd {
    # Any member can serve any request; etcd forwards to the leader internally.
    # max_fails=0 keeps a briefly-restarting member eligible rather than
    # ejecting it, and proxy_next_upstream moves on if it is actually down.
    server 127.0.0.1:2379 max_fails=0;
    server 127.0.0.1:2479 max_fails=0;
    server 127.0.0.1:2579 max_fails=0;
    keepalive 32;
}

# Separate upstream for gRPC, deliberately WITHOUT `keepalive`.
# grpc_pass cannot share a keepalive-enabled upstream with proxy_pass: nginx
# caches HTTP/1.1 connections there and then fails the HTTP/2 request with
# "no connection data found for keepalive http2 connection" -> 502.
upstream consensus_etcd_grpc {
    server 127.0.0.1:2379 max_fails=0;
    server 127.0.0.1:2479 max_fails=0;
    server 127.0.0.1:2579 max_fails=0;
}

# Edge backstop. etcd itself has no per-client rate limiting, so a single
# misbehaving client could otherwise saturate the cluster.
limit_req_zone $binary_remote_addr zone=consensus_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=consensus_auth:10m rate=10r/s;

server {
    listen 80;
    server_name consensus.rodmena.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;                       # required for the gRPC API
    server_name consensus.rodmena.co.uk;

    ssl_certificate /etc/letsencrypt/live/consensus.rodmena.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consensus.rodmena.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/consensus.rodmena.co.uk.access.log;
    error_log  /var/log/nginx/consensus.rodmena.co.uk.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # etcd is configured with --max-request-bytes 1572864 (1.5 MB). Reject
    # anything larger at the edge so it never reaches a member.
    client_max_body_size 2m;

    # ---------------------------------------------------------------- blocked
    # Total-exfiltration and cluster-topology operations. etcd RBAC already
    # restricts these to the root role; refusing them here means a leaked root
    # credential still cannot dump the database or reshape the cluster from the
    # public internet. Operate these from the host with docker exec instead.
    location = /v3/maintenance/snapshot   { return 403 '{"error":"blocked at edge: full-database snapshot is not available over the public API. Run it on the host."}'; }
    location = /v3/maintenance/defragment { return 403 '{"error":"blocked at edge: defragment is an operator action. Run it on the host."}'; }
    location = /v3/maintenance/downgrade  { return 403 '{"error":"blocked at edge: downgrade is an operator action."}'; }
    location = /v3/maintenance/transfer-leadership { return 403 '{"error":"blocked at edge: leadership transfer is an operator action."}'; }
    location = /v3/maintenance/alarm      { return 403 '{"error":"blocked at edge: alarm management is an operator action."}'; }
    location = /v3/cluster/member/add     { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/cluster/member/remove  { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/cluster/member/update  { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/cluster/member/promote { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/auth/disable           { return 403 '{"error":"blocked at edge: authentication cannot be disabled over the public API."}'; }

    # Same operations reached over gRPC. Path-based blocks on /v3/ do not cover
    # these -- gRPC addresses methods as /package.Service/Method.
    location = /etcdserverpb.Maintenance/Snapshot   { return 403; }
    location = /etcdserverpb.Maintenance/Defragment { return 403; }
    location = /etcdserverpb.Maintenance/Downgrade  { return 403; }
    location = /etcdserverpb.Maintenance/MoveLeader { return 403; }
    location = /etcdserverpb.Maintenance/Alarm      { return 403; }
    location = /etcdserverpb.Cluster/MemberAdd      { return 403; }
    location = /etcdserverpb.Cluster/MemberRemove   { return 403; }
    location = /etcdserverpb.Cluster/MemberUpdate   { return 403; }
    location = /etcdserverpb.Cluster/MemberPromote  { return 403; }
    location = /etcdserverpb.Auth/AuthDisable       { return 403; }

    # ------------------------------------------------------------------ auth
    # Tighter limit: this is the credential-guessing surface.
    location = /v3/auth/authenticate {
        limit_req zone=consensus_auth burst=20 nodelay;
        proxy_pass http://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # --------------------------------------------------------------- streams
    # Watch and lease keepalive are long-lived streams. Buffering or a short
    # read timeout would silently break change notification -- the single most
    # common reason to use a consensus store at all.
    location ~ ^/v3/(watch|lease/keepalive)$ {
        limit_req zone=consensus_api burst=200 nodelay;
        proxy_pass http://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ------------------------------------------------------------ JSON API
    location /v3/ {
        limit_req zone=consensus_api burst=200 nodelay;
        proxy_pass http://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # etcd's own unauthenticated cluster health check.
    location = /health {
        proxy_pass http://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ---------------------------------------------------------------- gRPC
    # Real etcd clients (etcdctl, go.etcd.io/etcd/client/v3, python-etcd3)
    # speak gRPC. These prefixes cover the whole etcd API surface.
    location /etcdserverpb. {
        grpc_pass grpc://consensus_etcd_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }
    location /v3lockpb. {
        grpc_pass grpc://consensus_etcd_grpc;
        grpc_set_header Host $host;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }
    location /v3electionpb. {
        grpc_pass grpc://consensus_etcd_grpc;
        grpc_set_header Host $host;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
    }

    # ---------------------------------------------------------------- docs
    location = /llms.txt {
        root /var/www/consensus;
        default_type text/plain; charset utf-8;
        add_header Cache-Control "public, max-age=300";
    }

    location /docs {
        root /var/www/consensus;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = / { return 302 /docs; }
}
