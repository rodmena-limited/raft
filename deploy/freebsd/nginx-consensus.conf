# consensus.rodmena.co.uk -- public TLS edge, running on vm-2 (bikeroom).
#
# MOVED OFF THE WORKSTATION 2026-08-21. The edge used to run on vm-1 alongside
# the three etcd containers. vm-1 is the operator's development machine; keeping
# the public endpoint there made the service hostage to a box that is rebooted
# and reconfigured routinely.
#
# UPSTREAMS ARE HTTPS WITH A CLIENT CERTIFICATE. The members now require mutual
# TLS on 2379, so plain proxy_pass would be refused. nginx presents the
# etcd-client certificate; etcd RBAC still applies on top of that.
#
# Local member first: normal traffic never leaves the host. The two remote
# members are backups so the edge survives the local member being down.
upstream consensus_etcd {
    server 127.0.0.1:2379    max_fails=0;
    server 51.91.248.208:2379  backup max_fails=0;
    server 57.131.136.207:2379 backup max_fails=0;
    keepalive 32;
}
upstream consensus_etcd_grpc {
    server 127.0.0.1:2379    max_fails=0;
    server 51.91.248.208:2379  backup max_fails=0;
    server 57.131.136.207:2379 backup max_fails=0;
}

limit_req_zone $binary_remote_addr zone=consensus_api:10m  rate=100r/s;
limit_req_zone $binary_remote_addr zone=consensus_auth:10m rate=10r/s;

server {
    listen 80;
    server_name consensus.rodmena.co.uk;
    location /.well-known/acme-challenge/ { root /usr/local/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name consensus.rodmena.co.uk;

    ssl_certificate     /usr/local/etc/letsencrypt/live/consensus.rodmena.co.uk/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/consensus.rodmena.co.uk/privkey.pem;

    access_log /var/log/nginx/consensus.access.log;
    error_log  /var/log/nginx/consensus.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 2m;

    # Client certificate nginx presents to etcd, and the CA it verifies etcd with.
    proxy_ssl_certificate        /usr/local/etc/etcd/pki/etcd-client.crt;
    proxy_ssl_certificate_key    /usr/local/etc/etcd/pki/etcd-client.key;
    proxy_ssl_trusted_certificate /usr/local/etc/etcd/pki/ca.crt;
    proxy_ssl_verify             on;
    proxy_ssl_verify_depth       2;
    proxy_ssl_name               localhost;
    proxy_ssl_server_name        on;

    grpc_ssl_certificate         /usr/local/etc/etcd/pki/etcd-client.crt;
    grpc_ssl_certificate_key     /usr/local/etc/etcd/pki/etcd-client.key;
    grpc_ssl_trusted_certificate /usr/local/etc/etcd/pki/ca.crt;
    grpc_ssl_verify              on;
    grpc_ssl_name                localhost;
    grpc_ssl_server_name         on;

    # ---- operator-only endpoints, refused at the edge ---------------------
    # These are reachable to anyone holding an app credential otherwise, and
    # each one can take the cluster down or exfiltrate the whole keyspace.
    location = /v3/maintenance/snapshot   { return 403 '{"error":"blocked at edge: full-database snapshot is not available over the public API. Run it on a member."}'; }
    location = /v3/maintenance/defragment { return 403 '{"error":"blocked at edge: defragment is an operator action."}'; }
    location = /v3/maintenance/downgrade  { return 403 '{"error":"blocked at edge: downgrade is an operator action."}'; }
    location = /v3/maintenance/transfer-leadership { return 403 '{"error":"blocked at edge: leadership transfer is an operator action."}'; }
    location = /v3/maintenance/alarm      { return 403 '{"error":"blocked at edge: alarm management is an operator action."}'; }
    location = /v3/cluster/member/add     { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/cluster/member/remove  { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/cluster/member/update  { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/cluster/member/promote { return 403 '{"error":"blocked at edge: cluster membership is an operator action."}'; }
    location = /v3/auth/disable           { return 403 '{"error":"blocked at edge: authentication cannot be disabled over the public API."}'; }
    location = /etcdserverpb.Maintenance/Snapshot   { return 403; }
    location = /etcdserverpb.Maintenance/Defragment { return 403; }
    location = /etcdserverpb.Maintenance/Downgrade  { return 403; }
    location = /etcdserverpb.Maintenance/MoveLeader { return 403; }
    location = /etcdserverpb.Maintenance/Alarm      { return 403; }
    location = /etcdserverpb.Cluster/MemberAdd      { return 403; }
    location = /etcdserverpb.Cluster/MemberRemove   { return 403; }
    location = /etcdserverpb.Cluster/MemberUpdate   { return 403; }
    location = /etcdserverpb.Cluster/MemberPromote  { return 403; }
    location = /etcdserverpb.Auth/AuthDisable       { return 403; }

    location = /v3/auth/authenticate {
        limit_req zone=consensus_auth burst=20 nodelay;
        proxy_pass https://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location ~ ^/v3/(watch|lease/keepalive)$ {
        limit_req zone=consensus_api burst=200 nodelay;
        proxy_pass https://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /v3/ {
        limit_req zone=consensus_api burst=200 nodelay;
        proxy_pass https://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /health {
        proxy_pass https://consensus_etcd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /etcdserverpb. {
        grpc_pass grpcs://consensus_etcd_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
    }

    # The site root holds llms.txt and docs/. There is no index.html at the top
    # level, so serve the docs there rather than returning "directory index
    # forbidden", which is what a bare root= does.
    location = / { return 302 /docs/; }
    location / {
        root /usr/local/www/consensus;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
