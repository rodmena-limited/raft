[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raft-py"
version = "0.1.0"
description = "Production-grade Raft consensus in Python 3.12 with asyncio gRPC and filesystem storage"
authors = [{name = "Sisyphus"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.62",
  "grpcio-tools>=1.62",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.99",
  "coverage[toml]>=7.4",
  "ruff>=0.4.8",
  "mypy>=1.10",
  "types-protobuf>=5.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src/raft"]
omit = ["src/raft/rpc/proto/*_pb2*.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "W", "UP", "DTZ", "Q"]
ignore = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# Generated protobuf/grpc modules (regenerated by scripts/gen_proto.sh) are
# dynamically typed; mypy cannot see their message classes.
exclude = "src/raft/rpc/proto/(raft_pb2|raft_pb2_grpc)\\.py$"

[[tool.mypy.overrides]]
module = "raft.rpc.proto.*"
follow_imports = "skip"
