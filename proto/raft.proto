syntax = "proto3";

package raft;

// Log entry payload is opaque bytes; state machine interprets it.
message LogEntry {
  int64 index = 1;
  int64 term = 2;
  bytes data = 3;
}

message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3; // highest index replicated on follower
}

message InstallSnapshotRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  bytes data = 5; // full snapshot blob
}

message InstallSnapshotResponse {
  int64 term = 1;
  bool accepted = 2;
}

message ClientWriteRequest {
  bytes data = 1; // application command
}

message ClientWriteResponse {
  bool accepted = 1;
  int64 index = 2;
  int64 term = 3;
}

message MembershipChangeRequest {
  string node_id = 1;
  bool add = 2; // true to add, false to remove
}

message MembershipChangeResponse {
  bool accepted = 1;
  string message = 2;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc ClientWrite(ClientWriteRequest) returns (ClientWriteResponse);
  rpc ChangeMembership(MembershipChangeRequest) returns (MembershipChangeResponse);
}
